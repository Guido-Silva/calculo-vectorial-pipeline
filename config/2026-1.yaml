ciclo: "2026-1"

dashboard:
  sheet_id: "TU_SHEET_ID_AQUI"  # Reemplazar localmente, no subir el ID real
  hoja_notas: "Notas"
  hoja_formativa: "Formativa"

fuentes:
  canvas:
    teoria_1: "Teoria_1.csv"
    teoria_2: "Teoria_2.csv"
  gradescope:
    ea_patron: "EA{n}_Teor{s}.csv"
    tarea_2: "Tarea_2_scores.csv"
    tarea_3b: "Tarea_3B_scores.csv"

evaluaciones:
  T1:  {fuente: canvas,     archivo: teoria_1, columna: "Tarea 1"}
  T2:  {fuente: gradescope, archivo: tarea_2}
  T3A: {fuente: canvas,     archivo: teoria_1, columna: "Tarea 3 - Parte A"}
  T3B: {fuente: gradescope, archivo: tarea_3b}
  T4:  {fuente: canvas,     archivo: teoria_1, columna: "Tarea 4"}
  T5:  {fuente: pendiente}
  T6:  {fuente: pendiente}
  EA1: {fuente: gradescope, patron: ea_patron, n: 1}
  EA2: {fuente: gradescope, patron: ea_patron, n: 2}
  EA3: {fuente: gradescope, patron: ea_patron, n: 3}
  EA4: {fuente: pendiente}
  EA5: {fuente: pendiente}
  EA6: {fuente: pendiente}
  RC1: {fuente: pendiente}
  RC2: {fuente: pendiente}
  ExP: {fuente: pendiente}
  ExF: {fuente: pendiente}
  SExP: {fuente: pendiente}
  SExF: {fuente: pendiente}

ap_videos:
  BPEA1:
    videos: 12
    usar_mejores: 11
    condicion: "EP >= 8"
  BPEA2:
    # Semana 9 tiene 2 videos (AP7V1, AP7V2), semanas 10,11,13 tienen 1 cada una
    semanas: [9, 10, 11, 13]
    videos: 5
    usar_mejores: 5
    condicion: "RC2 >= 15"

pesos:
  NF:  {TA1: 0.25, TA2: 0.25, EP: 0.20, EF: 0.30}
  TA1: {PT1: 0.25, PfEA1: 0.70, RC1: 0.05}
  TA2: {PT2: 0.10, PfEA2: 0.70, RC2: 0.20}

bonus_simulacro:
  nivel_1: {min: 14, max: 17, puntos: 1}
  nivel_2: {min: 18, max: 20, puntos: 2}

secciones:
  auditorio: [1, 2]
  aula: [11, 12, 13, 14, 21, 22, 23, 24]

merge:
  llave_primaria: "Código"
  llave_fallback: "Correo"

canvas_api:
  base_url: "https://utec.instructure.com"   # Confirmar URL con UTEC IT
  course_id: "TU_COURSE_ID_AQUI"             # ID numérico del curso: canvas.utec.edu.pe/courses/XXXXXX
  # Mapeo: nombre_columna_pipeline → assignment_id en Canvas
  # Para Tareas: ya existen en Canvas, copiar el ID de la URL del assignment
  # Para EAs y Tareas de Gradescope: crear assignment en Canvas, linkear desde Gradescope, luego poner el ID aquí
  assignment_ids:
    # --- Tareas (ya existen en Canvas) ---
    "Tarea 1":           0        # Reemplazar con ID real
    "Tarea 3 - Parte A": 0        # Reemplazar con ID real
    "Tarea 4":           0        # Reemplazar con ID real
    "Tarea 5":           0        # Pendiente: crear en Canvas si no existe
    "Tarea 6":           0        # Pendiente: crear en Canvas si no existe
    # --- EAs (crear assignment en Canvas + linkar desde Gradescope) ---
    "EA1":               0        # Reemplazar con ID real tras linkear en Gradescope
    "EA2":               0        # Reemplazar con ID real tras linkear en Gradescope
    "EA3":               0        # Reemplazar con ID real tras linkear en Gradescope
    "EA4":               0        # Pendiente
    "EA5":               0        # Pendiente
    "EA6":               0        # Pendiente
    # --- Tareas de Gradescope (crear assignment en Canvas + linkar desde Gradescope) ---
    "Tarea 2":           0        # Reemplazar con ID real tras linkear en Gradescope
    "Tarea 3B":          0        # Reemplazar con ID real tras linkear en Gradescope
    # --- Exámenes y Recuperaciones ---
    "ExP":               0        # Pendiente
    "ExF":               0        # Pendiente
    "SExP":              0        # Pendiente (Simulacro ExP)
    "SExF":              0        # Pendiente (Simulacro ExF)
    "RC1":               0        # Pendiente
    "RC2":               0        # Pendiente
