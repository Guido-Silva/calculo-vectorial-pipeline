ciclo: "2026-1"

dashboard:
  sheet_id: "TU_SHEET_ID_AQUI"  # Reemplazar localmente, no subir el ID real
  hoja_notas: "Notas"
  hoja_formativa: "Formativa"

fuentes:
  canvas:
    teoria_1: "Teoria_1.csv"
    teoria_2: "Teoria_2.csv"
  gradescope:
    ea_patron: "EA{n}_Teor{s}.csv"
    tarea_2: "Tarea_2_scores.csv"
    tarea_3b: "Tarea_3B_scores.csv"

evaluaciones:
  T1:  {fuente: canvas,     archivo: teoria_1, columna: "Tarea 1"}
  T2:  {fuente: gradescope, archivo: tarea_2}
  T3A: {fuente: canvas,     archivo: teoria_1, columna: "Tarea 3 - Parte A"}
  T3B: {fuente: gradescope, archivo: tarea_3b}
  T4:  {fuente: canvas,     archivo: teoria_1, columna: "Tarea 4"}
  T5:  {fuente: pendiente}
  T6:  {fuente: pendiente}
  EA1: {fuente: gradescope, patron: ea_patron, n: 1}
  EA2: {fuente: gradescope, patron: ea_patron, n: 2}
  EA3: {fuente: gradescope, patron: ea_patron, n: 3}
  EA4: {fuente: pendiente}
  EA5: {fuente: pendiente}
  EA6: {fuente: pendiente}
  RC1: {fuente: pendiente}
  RC2: {fuente: pendiente}
  ExP: {fuente: pendiente}
  ExF: {fuente: pendiente}
  SExP: {fuente: pendiente}
  SExF: {fuente: pendiente}

ap_videos:
  BPEA1:
    videos: 12
    usar_mejores: 11
    condicion: "EP >= 8"
  BPEA2:
    # Semana 9 tiene 2 videos (AP7V1, AP7V2), semanas 10,11,13 tienen 1 cada una
    semanas: [9, 10, 11, 13]
    videos: 5
    usar_mejores: 5
    condicion: "RC2 >= 15"

pesos:
  NF:  {TA1: 0.25, TA2: 0.25, EP: 0.20, EF: 0.30}
  TA1: {PT1: 0.25, PfEA1: 0.70, RC1: 0.05}
  TA2: {PT2: 0.10, PfEA2: 0.70, RC2: 0.20}

bonus_simulacro:
  nivel_1: {min: 14, max: 17, puntos: 1}
  nivel_2: {min: 18, max: 20, puntos: 2}

secciones:
  auditorio: [1, 2]
  aula: [11, 12, 13, 14, 21, 22, 23, 24]

merge:
  llave_primaria: "Código"
  llave_fallback: "Correo"
